name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ghostline
          path: build/libs/*.jar
      # the jar is already uploaded above: the checks below only report on it
      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/ghostline-*.jar | grep -v -e '-sources' -e '-dev' | head -1)
          bash tools/verify-jar.sh "$JAR"
      - name: Pure-Java tests (no Minecraft needed)
        continue-on-error: true
        run: bash tools/run-tests.sh
