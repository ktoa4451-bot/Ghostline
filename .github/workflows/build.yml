name: Build Ghostline Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Find and extract ZIP
      - name: Extract Ghostline ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "ghostline-mod-v3.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Ghostline ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "========== EXTRACTED FILES =========="
          find extracted -maxdepth 5 -type f | sort | head -300

      # 4. Find Gradle project
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "========== PROJECT FILES =========="
          ls -la "$PROJECT_DIR"

      # 5. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 6. Build project
      - name: Build Ghostline
        id: build
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "========== JAVA =========="
          java -version

          echo "========== GRADLE =========="
          gradle --version

          echo "========== PROJECT =========="
          pwd
          ls -la

          echo "========== BUILD =========="
          gradle build \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      # 7. Upload JAR
      - name: Upload Ghostline JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-Client
          path: |
            extracted/**/build/libs/*.jar
            extracted/build/libs/*.jar
          if-no-files-found: error
          compression-level: 6

      # 8. Save build log even if build fails
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-Build-Log
          path: build-log.txt
          if-no-files-found: ignore
          compression-level: 6
