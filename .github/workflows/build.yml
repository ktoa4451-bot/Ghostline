name: Build Ghostline Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Ghostline ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "ghostline-mod-v3.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Ghostline ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "========== EXTRACTED FILES =========="
          find extracted -maxdepth 5 -type f | sort | head -300

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Ghostline
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle build \
            --no-daemon \
            --stacktrace

      - name: Upload Ghostline JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-Client
          path: |
            extracted/**/build/libs/*.jar
            extracted/build/libs/*.jar
          if-no-files-found: error
          compression-level: 6
