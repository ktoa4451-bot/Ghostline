name: Ghostline v8 Build

'on':
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract ZIP
    run: |
      mkdir -p project
      unzip -o ghostline-mod-v8.zip -d project

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.0'

  - name: Build
    run: |
      PROJECT_DIR="$(find project -type f -name build.gradle -printf '%h\n' | head -n 1)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: build.gradle not found"
        exit 1
      fi
      gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: GHOSTLINE-CLIENT-v8
      path: project/**/build/libs/*.jar
      if-no-files-found: error
