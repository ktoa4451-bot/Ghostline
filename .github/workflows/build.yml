name: Build Ghostline Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for Gradle files..."
          find . -maxdepth 4 \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            WRAPPER=$(find . -type f -name gradlew \
              -not -path "*/.gradle/*" | head -n 1)
            if [ -z "$WRAPPER" ]; then
              echo "::error::gradlew not found. Upload the complete Gradle project."
              exit 1
            fi
            echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-Client
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
          compression-level: 6
