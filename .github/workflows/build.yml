Создай или замени файл ".github/workflows/build.yml":

name: Build Ghostline Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect project
        run: |
          echo "Repository files:"
          ls -la
          echo "Build files:"
          find . -maxdepth 4 \
            \( -name "gradlew" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Build Ghostline
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            echo "Gradle Wrapper missing. Add gradlew and gradle/wrapper files."
            exit 1
          else
            echo "Gradle project not found in repository root."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Ghostline-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
