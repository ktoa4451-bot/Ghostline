
name: Build Ghostline Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find project directory
        id: project
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FILE=$(find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" | head -n 1)

            if [ -z "$FILE" ]; then
              echo "::error::settings.gradle not found"
              exit 1
            fi

            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Ghostline
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Building from: $(pwd)"
          ls -la
          gradle tasks --stacktrace
          gradle build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-Client
          path: '**/build/libs/*.jar'
          if-no-files-found: error
