name: Ghostline v8 Build

'on':
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'ghostline-mod-v8.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ghostline-mod-v8.zip not found in repository root"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          test -f project/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build JAR
        run: gradle -p project build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTLINE-CLIENT-v8
          path: project/build/libs/*.jar
          if-no-files-found: error
