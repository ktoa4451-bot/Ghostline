
name: Ghostline Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          find . -type f -name "*.zip"

      - name: Extract ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP" -d project

      - name: Find Gradle
        run: |
          find project -type f \( \
            -name "gradlew" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          set -eux

          GRADLE=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          cd "$(dirname "$GRADLE")"
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          
