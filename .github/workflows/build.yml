name: Build GHOSTLINE CLIENT v8

on:
workflow_dispatch:
push:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show repository files
    run: |
      echo "=== Repository files ==="
      ls -la
      echo "=== ZIP files ==="
      find . -maxdepth 3 -type f -iname '*.zip' -print

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find and extract project
    shell: bash
    run: |
      set -e
      ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'ghostline-mod-v8*.zip' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "::error::Ghostline v8 ZIP not found. Upload ghostline-mod-v8.zip to the repository root."
        exit 1
      fi

      echo "Using archive: $ZIP_FILE"
      mkdir -p project
      unzip -o "$ZIP_FILE" -d project

      PROJECT_DIR="$(find project -type f -name build.gradle -printf '%h\n' | head -n 1)"

      if [ -z "$PROJECT_DIR" ]; then
        echo "::error::build.gradle was not found in the archive."
        find project -maxdepth 4 -type f
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"
      ls -la "$PROJECT_DIR"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.0'

  - name: Build mod
    shell: bash
    run: |
      set -o pipefail
      gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace --info 2>&1 | tee build.log

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: ghostline-v8-build-log
      path: build.log
      if-no-files-found: ignore

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: GHOSTLINE-CLIENT-v8
      path: project/**/build/libs/*.jar
      if-no-files-found: error
