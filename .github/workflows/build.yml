name: Build GHOSTLINE CLIENT v8

'on':
workflow_dispatch:
push:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find and extract project
    shell: bash
    run: |
      set -e
      ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'ghostline-mod-v8*.zip' | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "Ghostline v8 ZIP not found"
        exit 1
      fi
      mkdir -p project
      unzip -o "$ZIP_FILE" -d project
      PROJECT_DIR="$(find project -type f -name build.gradle -printf '%h\n' | head -n 1)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "build.gradle not found"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.0'

  - name: Build mod
    run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: GHOSTLINE-CLIENT-v8
      path: project/**/build/libs/*.jar
      if-no-files-found: error
