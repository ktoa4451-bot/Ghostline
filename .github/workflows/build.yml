name: Build JAR from ZIP

'on':
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Install Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find ZIP
    shell: bash
    run: |
      ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "::error::No ZIP file found in repository root"
        exit 1
      fi
      echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
      echo "Found: $ZIP_FILE"

  - name: Extract ZIP
    run: |
      mkdir -p source
      unzip -o "$ZIP_FILE" -d source
      find source -type f \( -name build.gradle -o -name build.gradle.kts \)

  - name: Locate Gradle project
    shell: bash
    run: |
      PROJECT_DIR="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | head -n 1)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "::error::No Gradle build file found inside ZIP"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Build Minecraft mod
    shell: bash
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then
        ./gradlew build --no-daemon --stacktrace
      else
        echo "::error::Gradle wrapper missing. Add gradlew and gradle/wrapper files to the ZIP."
        exit 1
      fi

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: GHOSTLINE-CLIENT-JAR
      path: source/**/build/libs/*.jar
      if-no-files-found: error
