name: Build GHOSTLINE CLIENT v8

on:
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Extract Ghostline v8
    run: |
      mkdir -p project
      unzip -q ghostline-mod-v8.zip -d project
      test -f project/build.gradle
      test -f project/settings.gradle

  - name: Setup Gradle 9.2.0
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.2.0'

  - name: Build Minecraft mod
    run: gradle -p project build --no-daemon --stacktrace

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: GHOSTLINE-CLIENT-v8
      path: project/build/libs/*.jar
      if-no-files-found: error
