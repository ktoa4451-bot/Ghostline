
name: Build Ghostline

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate or extract project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find . -type f -name build.gradle \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -printf '%h\n' | head -n 1 || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' \
              -not -path './.git/*' \
              -printf '%p\n' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No build.gradle or project ZIP found."
              echo "Upload the Ghostline project ZIP or its extracted files."
              exit 1
            fi

            mkdir -p _extracted_project
            unzip -q "$ZIP_FILE" -d _extracted_project

            PROJECT_DIR="$(find _extracted_project -type f \
              -name build.gradle \
              -not -path '*/build/*' \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find build.gradle."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        shell: bash
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: List generated JARs
        shell: bash
        run: |
          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' -print || true

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ghostline
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          
