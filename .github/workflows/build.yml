
name: Build Ghostline v8

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Ищем готовый проект
          PROJECT_DIR="$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1 || true)"

          # Если проекта нет — ищем ZIP
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -printf '%p\n' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Project files and ZIP archive were not found."
              echo "Upload the Ghostline ZIP to the repository."
              exit 1
            fi

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            PROJECT_DIR="$(find extracted -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle build file not found inside the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          cache-disabled: true

      - name: Build Ghostline
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-v8
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          
