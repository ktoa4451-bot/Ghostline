
name: Build Ghostline

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and locate project
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found. Checking repository directly."
            ROOT="."
          else
            unzip -o "$ZIP" -d extracted
            ROOT="extracted"
          fi

          FILE=$(find "$ROOT" -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Gradle build file not found."
            find "$ROOT" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build JAR
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            echo "gradlew missing; checking system Gradle"
            gradle build --no-daemon --stacktrace
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ghostline-JAR
          path: |
            extracted/**/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
          
